# Shadegram — gera o IPA para instalar com Sideloadly (Apple ID grátis).
# Só roda manualmente: Actions → Build Shadegram → Run workflow.
# Secrets obrigatórios: TELEGRAM_API_ID e TELEGRAM_API_HASH (my.telegram.org).

name: Build Shadegram

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Máquina macOS (precisa ter Xcode 27)
        type: choice
        options:
          - xcode-27
          - macos-26
        default: xcode-27

concurrency:
  group: shadegram-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 300

    env:
      BAZEL_USER_ROOT: /private/var/tmp/_bazel_shadegram
      BAZEL_CACHE_DIR: ${{ github.workspace }}/.bazel-cache

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Submódulos (URLs relativas apontam para o repo oficial)
        run: |
          git config --file=.gitmodules submodule.submodules/rlottie/rlottie.url https://github.com/TelegramMessenger/rlottie.git
          git config --file=.gitmodules submodule.submodules/TgVoipWebrtc/tgcalls.url https://github.com/TelegramMessenger/tgcalls.git
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1 --jobs 8

      - name: Aceitar perfil falso vencido
        run: |
          # O perfil "fake-codesigning" do repo oficial venceu em 30/10/2026. Ele só serve para empacotar:
          # o Sideloadly reassina o app com o Apple ID. Desliga a checagem de validade do rules_apple.
          set -euo pipefail
          F=build-system/bazel-rules/rules_apple/tools/plisttool/plisttool.py
          sed -i '' 's/    if expire and expire < datetime.datetime.now():/    if False and expire and expire < datetime.datetime.now():/' "$F"
          grep -n "if False and expire" "$F"

      - name: Selecionar Xcode 27
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          XCODE="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1 || true)"
          [ -n "$XCODE" ] || { echo "::error::Nenhum Xcode 27 nesta máquina"; exit 1; }
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          # A imagem do runner vem sem o compilador de shaders Metal.
          xcrun -f metal >/dev/null 2>&1 && xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - name: Liberar disco
        run: |
          df -h /
          sudo rm -rf /Users/runner/Library/Developer/CoreSimulator/Caches /Users/runner/.cargo /Users/runner/.rustup /usr/local/lib/android /Users/runner/Library/Android || true
          df -h /

      - name: Restaurar cache do Bazel
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BAZEL_CACHE_DIR }}
          key: bazel-${{ inputs.runner }}-${{ hashFiles('versions.json', 'MODULE.bazel.lock') }}-${{ github.run_id }}
          restore-keys: |
            bazel-${{ inputs.runner }}-${{ hashFiles('versions.json', 'MODULE.bazel.lock') }}-
            bazel-${{ inputs.runner }}-

      - name: Configuração de build (api_id dos secrets)
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          api_id = os.environ.get("TELEGRAM_API_ID", "").strip()
          api_hash = os.environ.get("TELEGRAM_API_HASH", "").strip()
          if not api_id or not api_hash:
              print("::error::Faltam os secrets TELEGRAM_API_ID / TELEGRAM_API_HASH")
              sys.exit(1)
          with open("build-system/appstore-configuration.json") as f:
              cfg = json.load(f)
          # bundle_id/team_id ficam iguais aos perfis falsos (fake-codesigning); o Sideloadly troca na assinatura.
          cfg["api_id"] = api_id
          cfg["api_hash"] = api_hash
          cfg["enable_siri"] = False
          cfg["enable_icloud"] = False
          with open("build-system/shadegram-configuration.json", "w") as f:
              json.dump(cfg, f, indent="\t")
          print("configuração gerada (api_id e hash não exibidos)")
          PY

      - name: Compilar
        run: |
          set -euo pipefail
          BUILD_NUMBER="$(( $(cat build_number_offset) + GITHUB_RUN_NUMBER ))"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          mkdir -p "$BAZEL_CACHE_DIR" build/artifacts
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$BAZEL_CACHE_DIR" \
            build \
            --configurationPath=build-system/shadegram-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --shadeDisableExtensions \
            --outputBuildArtifactsPath=build/artifacts \
            2>&1 | tee build.log

      - name: Salvar cache do Bazel
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BAZEL_CACHE_DIR }}
          key: bazel-${{ inputs.runner }}-${{ hashFiles('versions.json', 'MODULE.bazel.lock') }}-${{ github.run_id }}

      - name: Erros de compilação
        if: failure()
        run: |
          grep -E '(^| )error:' build.log | tail -40 || true

      - name: Enviar log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Enviar IPA
        uses: actions/upload-artifact@v5
        with:
          name: Shadegram-${{ env.BUILD_NUMBER }}
          path: build/artifacts/Telegram.ipa
          if-no-files-found: error
          retention-days: 7
